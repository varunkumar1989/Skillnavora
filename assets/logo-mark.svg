<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SkillNavora">
  <title>SkillNavora</title>
  <defs>
    <linearGradient id="bz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9d1de"/><stop offset="1" stop-color="#6b778f"/></linearGradient>
    <linearGradient id="bi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5670"/><stop offset="1" stop-color="#e6ebf2"/></linearGradient>
    <radialGradient id="fc" cx=".42" cy=".32" r=".8"><stop offset="0" stop-color="#22355f"/><stop offset=".6" stop-color="#0e1b3a"/><stop offset="1" stop-color="#060d20"/></radialGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="cp" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8794ab"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0b1530" flood-opacity=".35"/></filter>
    <filter id="ns" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1.2" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      .ndl{transform-origin:64px 64px;animation:sway 6s ease-in-out infinite}
      @keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}}
      @media (prefers-reduced-motion:reduce){.ndl{animation:none}}
    </style>
  </defs>
  <g filter="url(#sh)">
    <circle cx="64" cy="64" r="60" fill="url(#bz)"/>
    <circle cx="64" cy="64" r="54" fill="url(#bi)"/>
    <circle cx="64" cy="64" r="51.5" fill="url(#fc)"/>
  </g>
  <g fill="none" transform="rotate(-90 64 64)">
    <circle cx="64" cy="64" r="45" stroke="#fff" stroke-opacity=".38" stroke-width="5" stroke-dasharray=".9 3.027"/>
    <circle cx="64" cy="64" r="45" stroke="#fff" stroke-width="7" stroke-dasharray="1.8 33.543" stroke-dashoffset=".9"/>
  </g>
  <g font-family="Outfit,'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-weight="800" text-anchor="middle">
    <text x="64" y="37" font-size="17" fill="#ff7a1a">N</text>
    <text x="64" y="104" font-size="17" fill="#ffffff">S</text>
    <text x="99" y="68" font-size="9" fill="#fff" fill-opacity=".55">E</text>
