<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 400' role='img' aria-label='Coding agent with swappable model engines'><rect width='780' height='400' rx='18' fill='#ffffff' stroke='#d9dfeb'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#55607a'/></marker></defs><text x='40' y='46' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='800' fill='#0d1630' text-anchor='start'>The agent is the body. The model is the engine.</text><text x='40' y='72' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='500' fill='#55607a' text-anchor='start'>Swap the engine without changing how you work.</text><rect x='40' y='110' width='260' height='170' rx='14' fill='#ece8ff' stroke='#6c4cf5' stroke-width='2'/><text x='170' y='150' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='800' fill='#0d1630' text-anchor='middle'>Coding agent</text><text x='170' y='176' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='500' fill='#55607a' text-anchor='middle'>reads files, edits code,</text><text x='170' y='196' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='500' fill='#55607a' text-anchor='middle'>runs commands</text><circle cx='170' cy='240' r='22' fill='white' stroke='#6c4cf5' stroke-width='3'/><text x='170' y='246' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='700' fill='#6c4cf5' text-anchor='middle'>you</text><line x1='300' y1='195' x2='380' y2='140' stroke='#16a34a' stroke-width='2.5' marker-end='url(#a)'/><rect x='380' y='110' width='360' height='66' rx='14' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='398' y='138' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='#0d1630' text-anchor='start'>Local engine: Ollama on your laptop</text><text x='398' y='160' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='500' fill='#55607a' text-anchor='start'>Private · offline · hardware limit</text><line x1='300' y1='195' x2='380' y2='240' stroke='#d97706' stroke-width='2.5' marker-end='url(#a)'/><rect x='380' y='210' width='360' height='66' rx='14' fill='#fef3c7' stroke='#d97706' stroke-width='2'/><text x='398' y='238' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='#0d1630' text-anchor='start'>Cloud free engine: OpenRouter free models</text><text x='398' y='260' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='500' fill='#55607a' text-anchor='start'>Daily limits · your prompts leave the laptop</text><line x1='300' y1='195' x2='380' y2='340' stroke='#6c4cf5' stroke-width='2.5' marker-end='url(#a)'/><rect x='380' y='310' width='360' height='66' rx='14' fill='#ece8ff' stroke='#6c4cf5' stroke-width='2'/><text x='398' y='338' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='#0d1630' text-anchor='start'>Router: Omni Route, several providers</text><text x='398' y='360' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='500' fill='#55607a' text-anchor='start'>Switches when one runs out · check terms</text></svg>