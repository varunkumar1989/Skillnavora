<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 330' role='img' aria-label='Laptop running a model with Wi-Fi off'><rect width='640' height='330' rx='18' fill='#ffffff' stroke='#d9dfeb'/><text x='40' y='46' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='800' fill='#0d1630' text-anchor='start'>Offline with Ollama: once a model is downloaded</text><rect x='60' y='96' width='300' height='170' rx='14' fill='#f3f4f6' stroke='#d9dfeb' stroke-width='2'/><text x='210' y='128' font-family='Inter,Arial,sans-serif' font-size='16' font-weight='800' fill='#0d1630' text-anchor='middle'>Your laptop</text><rect x='96' y='146' width='228' height='70' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='210' y='176' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='#16a34a' text-anchor='middle'>Model runs here</text><text x='210' y='200' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='500' fill='#55607a' text-anchor='middle'>code and prompts stay on this machine</text><g transform='translate(430,120)'><path d='M0 30 Q40 0 80 30' fill='none' stroke='#55607a' stroke-width='3'/><path d='M12 46 Q40 22 68 46' fill='none' stroke='#55607a' stroke-width='3'/><circle cx='40' cy='62' r='5' fill='#55607a'/><line x1='0' y1='0' x2='80' y2='80' stroke='#dc2626' stroke-width='5'/></g><text x='430' y='230' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='700' fill='#991b1b' text-anchor='middle'>Wi-Fi off</text><text x='40' y='300' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='500' fill='#55607a' text-anchor='start'>Check the model is installed before you go offline (run it once while online).</text></svg>