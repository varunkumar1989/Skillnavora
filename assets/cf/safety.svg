<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 380' role='img' aria-label='Six safety rules for free AI coding setups'><rect width='700' height='380' rx='18' fill='#ffffff' stroke='#d9dfeb'/><text x='40' y='46' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='800' fill='#0d1630' text-anchor='start'>Six rules before you use a free setup</text><rect x='40' y='84' width='620' height='36' rx='10' fill='#ece8ff' stroke='#d9dfeb' stroke-width='2'/><circle cx='64' cy='102' r='11' fill='#6c4cf5'/><text x='64' y='107' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='800' fill='white' text-anchor='middle'>1</text><text x='88' y='107' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='600' fill='#0d1630' text-anchor='start'>Nothing is unlimited: plan for daily caps</text><rect x='40' y='130' width='620' height='36' rx='10' fill='#f8f9fc' stroke='#d9dfeb' stroke-width='2'/><circle cx='64' cy='148' r='11' fill='#6c4cf5'/><text x='64' y='153' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='800' fill='white' text-anchor='middle'>2</text><text x='88' y='153' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='600' fill='#0d1630' text-anchor='start'>Free is not private: keep client code local</text><rect x='40' y='176' width='620' height='36' rx='10' fill='#ece8ff' stroke='#d9dfeb' stroke-width='2'/><circle cx='64' cy='194' r='11' fill='#6c4cf5'/><text x='64' y='199' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='800' fill='white' text-anchor='middle'>3</text><text x='88' y='199' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='600' fill='#0d1630' text-anchor='start'>Check terms before connecting any account</text><rect x='40' y='222' width='620' height='36' rx='10' fill='#f8f9fc' stroke='#d9dfeb' stroke-width='2'/><circle cx='64' cy='240' r='11' fill='#6c4cf5'/><text x='64' y='245' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='800' fill='white' text-anchor='middle'>4</text><text x='88' y='245' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='600' fill='#0d1630' text-anchor='start'>Keys are passwords: store and rotate them</text><rect x='40' y='268' width='620' height='36' rx='10' fill='#ece8ff' stroke='#d9dfeb' stroke-width='2'/><circle cx='64' cy='286' r='11' fill='#6c4cf5'/><text x='64' y='291' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='800' fill='white' text-anchor='middle'>5</text><text x='88' y='291' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='600' fill='#0d1630' text-anchor='start'>Check the billing page, not the menu label</text><rect x='40' y='314' width='620' height='36' rx='10' fill='#f8f9fc' stroke='#d9dfeb' stroke-width='2'/><circle cx='64' cy='332' r='11' fill='#6c4cf5'/><text x='64' y='337' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='800' fill='white' text-anchor='middle'>6</text><text x='88' y='337' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='600' fill='#0d1630' text-anchor='start'>Expect errors: copy the message, fix one thing</text></svg>