<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 380' role='img' aria-label='Router trying providers in order until one answers'><rect width='800' height='380' rx='18' fill='#ffffff' stroke='#d9dfeb'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0 L10 5 L0 10 z' fill='#55607a'/></marker></defs><text x='40' y='46' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='800' fill='#0d1630' text-anchor='start'>How a router keeps one task going</text><text x='40' y='72' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='500' fill='#55607a' text-anchor='start'>If the first provider is out of quota, the next one answers.</text><rect x='40' y='150' width='150' height='80' rx='14' fill='#ece8ff' stroke='#6c4cf5' stroke-width='2'/><text x='115' y='185' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='#0d1630' text-anchor='middle'>Your request</text><line x1='190' y1='190' x2='250' y2='190' stroke='#55607a' stroke-width='2.5' marker-end='url(#a)'/><rect x='250' y='150' width='170' height='80' rx='14' fill='#ece8ff' stroke='#6c4cf5' stroke-width='2'/><text x='335' y='185' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='#0d1630' text-anchor='middle'>Router</text><text x='335' y='208' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='500' fill='#55607a' text-anchor='middle'>tries in order</text><line x1='420' y1='175' x2='500' y2='115' stroke='#55607a' stroke-width='2.5' marker-end='url(#a)'/><line x1='420' y1='205' x2='500' y2='265' stroke='#55607a' stroke-width='2.5' marker-end='url(#a)'/><rect x='500' y='80' width='240' height='70' rx='14' fill='#fee2e2' stroke='#dc2626' stroke-width='2'/><text x='620' y='112' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='700' fill='#991b1b' text-anchor='middle'>Provider 1: quota used up</text><rect x='500' y='230' width='240' height='70' rx='14' fill='#dcfce7' stroke='#16a34a' stroke-width='2'/><text x='620' y='262' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='700' fill='#16a34a' text-anchor='middle'>Provider 2: answers</text><line x1='740' y1='265' x2='760' y2='265' stroke='#55607a' stroke-width='2.5' marker-end='url(#a)'/><text x='40' y='350' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='500' fill='#55607a' text-anchor='start'>Keep the router's key in a password manager, and connect only providers whose terms allow it.</text></svg>