<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SkillNavora">
<title>SkillNavora</title>
<defs>
  <clipPath id="head"><rect x="10" y="17" width="44" height="37" rx="13"/></clipPath>
  <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb866"/><stop offset="1" stop-color="#f28a1e"/></linearGradient>
  <linearGradient id="wh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e9f0"/></linearGradient>
  <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22a83a"/><stop offset="1" stop-color="#0c6b15"/></linearGradient>
  <radialGradient id="shade" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
  <linearGradient id="vis" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b3c94"/><stop offset="1" stop-color="#050f33"/></linearGradient>
  <radialGradient id="eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#8fe3ff"/><stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c2"/><stop offset=".45" stop-color="#f1c453"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3e96"/><stop offset="1" stop-color="#081f5e"/></linearGradient>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#061233" flood-opacity=".35"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".8"/></filter>
</defs>
<!-- star -->
<path filter="url(#drop)" d="M32 1.5 L34.1 7.4 L40.2 8.5 L34.1 9.6 L32 15.5 L29.9 9.6 L23.8 8.5 L29.9 7.4 Z" fill="url(#gold)" stroke="#8a6410" stroke-width=".5"/>
<g filter="url(#drop)">
  <!-- ears -->
  <rect x="4.5" y="29" width="7" height="14" rx="3.5" fill="url(#navy)"/>
  <rect x="52.5" y="29" width="7" height="14" rx="3.5" fill="url(#navy)"/>
  <!-- head in the tricolour -->
  <g clip-path="url(#head)">
    <rect x="10" y="17" width="44" height="13" fill="url(#sf)"/>
    <rect x="10" y="30" width="44" height="12" fill="url(#wh)"/>
    <rect x="10" y="42" width="44" height="12" fill="url(#gr)"/>
    <rect x="10" y="17" width="44" height="37" fill="url(#shade)"/>
  </g>
  <rect x="10" y="17" width="44" height="37" rx="13" fill="none" stroke="#0b2a78" stroke-width="2.4"/>
  <!-- visor and eyes -->
  <rect x="15.5" y="25.5" width="33" height="18" rx="9" fill="url(#vis)" stroke="#0b2a78" stroke-width="1"/>
  <path d="M19 28.5 Q32 25.5 45 28.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="25" cy="34.5" r="5" fill="url(#eye)" filter="url(#glow)"/>
  <circle cx="39" cy="34.5" r="5" fill="url(#eye)" filter="url(#glow)"/>
  <circle cx="25" cy="34.5" r="2.4" fill="#fff"/>
  <circle cx="39" cy="34.5" r="2.4" fill="#fff"/>
  <!-- neck -->
  <rect x="25" y="54" width="14" height="6.5" rx="3" fill="url(#navy)"/>
</g>
</svg>
