# Cloudflare Pages settings for skillnavora.in
# The AI chat function (functions/api/chat.js) needs Node.js compatibility.
name = "skillnavora"
pages_build_output_dir = "."
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI (free daily allowance): the AI tools use it when other providers are busy or not set up.
[ai]
binding = "AI"
